<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>永不平凡籃球營</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --pri:#ff7315;--pri-grad:linear-gradient(135deg,#ff8c37 0%,#ff5e00 100%);
  --ink:#232d3f;--mut:#68798d;--card:#fff;--line:#f1eae2;
  --ok:#10b981;--ok-bg:#ecfdf5;--bad:#f43f5e;--bad-bg:#fff1f2;--warn:#f59e0b;--warn-bg:#fffbeb;
  --shadow-sm:0 4px 12px rgba(255,115,21,.06);--radius-lg:20px;--radius-md:14px;
}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 10% 10%,#fffbf7 0%,#f7f1ea 100%);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;border-bottom:1.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.12);background:#0f172a;font-size:24px}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
header b{font-size:17.5px;font-weight:800;color:#1e293b;display:block;line-height:1.3}
#greet{font-size:12.5px;color:var(--pri);font-weight:700;margin-top:1px;display:block}
main{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
h2{margin:0 0 14px;font-size:17px;font-weight:800;color:#1e293b;display:flex;align-items:center;justify-content:space-between;gap:8px}
input,select{display:block;width:100%!important;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid #e5e0d8;
  border-radius:var(--radius-md);background:#fdfcf9;margin:0 0 10px;color:var(--ink)}
input:focus,select:focus{border-color:var(--pri);background:#fff;outline:none;box-shadow:0 0 0 3.5px rgba(255,115,21,.14)}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-height:46px;line-height:1.3;text-align:left}
input[type=checkbox]{display:inline-block;width:19px!important;height:19px;margin:0 8px 0 0;accent-color:var(--pri)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:var(--radius-md);padding:12px 16px;transition:transform .1s ease}
button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:not-allowed}
.pri{width:100%;background:var(--pri-grad);color:#fff;box-shadow:0 6px 18px rgba(255,115,21,.28);font-size:16px}
.ghost{background:#f5efe6;color:#4a5568}
.mini{width:auto;padding:6px 12px;font-size:13px;border-radius:10px;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btns button{flex:1 1 auto;padding:10px 12px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed #f0e7dd}
.row:first-of-type{border-top:0}
.item{display:block;background:#fbf9f5;border:1.5px solid #f1eae2;border-radius:16px;padding:14px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.two>*{margin-bottom:0}
.muted{color:var(--mut);font-size:14px;margin:0 0 8px}
.pill{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.gray{background:#f1f5f9;color:#64748b}
.chk label{display:flex;align-items:center;padding:7px 0;font-size:15px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:16px 14px;box-shadow:var(--shadow-sm)}
.stat b{font-size:27px;font-weight:900;color:var(--pri);display:block;line-height:1.1;margin-bottom:4px}
.stat span{font-size:13px;color:var(--mut);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.seg button{padding:9px 0;background:#e9ecef;color:#495057;font-size:13px;border-radius:10px}
.seg button.on[data-s="未到"]{background:#64748b;color:#fff}
.seg button.on[data-s="出席"]{background:#10b981;color:#fff}
.seg button.on[data-s="請假"]{background:#f59e0b;color:#fff}
.seg button.on[data-s="缺席"]{background:#ef4444;color:#fff}
.kid-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.kid-btn{background:#fff;border:1.5px solid #e5ded5;color:#4a5568;padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.kid-btn.active{background:var(--pri-grad);border-color:transparent;color:#fff;font-weight:800}
.rules-box{background:#fffaf0;border:1.5px solid #fed7aa;border-radius:16px;padding:14px;margin-top:12px;font-size:13.5px;color:#7c2d12;line-height:1.65}
.rules-box b{color:#9a3412;font-size:14px}.rules-box ol{margin:8px 0 0;padding-left:18px}
.lockbar{background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:700;margin-bottom:10px}
.safe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.safe a{color:var(--pri);font-weight:700;text-decoration:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:14px 4px;color:#9ba7b6;font-size:14.5px;border-radius:0}
nav button.on{color:var(--pri);font-weight:800;box-shadow:inset 0 3.5px 0 var(--pri)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(35,45,63,.94);color:#fff;padding:11px 22px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .2s ease;font-size:14px;z-index:300;max-width:90%;text-align:center}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:200;padding:20px}
.modal .box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:340px;max-height:86vh;overflow:auto}
.modal p{margin:0 0 16px;line-height:1.8}
.modal .lab{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 4px}
.menu-btn{width:100%;margin-bottom:8px;text-align:left}
code{background:#f5efe6;padding:4px 8px;border-radius:8px;word-break:break-all;font-size:13px;color:var(--pri);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img src="./logo.png" alt="" onerror="this.replaceWith(document.createTextNode('🏀'))"></div>
    <div><b>永不平凡籃球營</b><span id="greet">活力載入中…</span></div>
  </div>
</header>
<main id="app"><p class="muted" style="text-align:center;padding:30px 0">載入中…</p></main>
<nav id="nav"></nav><div id="toast"></div>

<script>
const CONFIG = {
  LIFF_ID: '2012507478-35PGiqXO',
  API_URL: 'https://script.google.com/macros/s/AKfycbwXzUnQ1zvcQhCHZs3ezX5tGsJzTCkbQVJij4ID7dWD7kgPFsWFYbySGoqBA8nSasGUzQ/exec',
  // ⚠️ 上線前請改成真實匯款帳號
  BANK: '匯款帳號：822 中國信託 1234-5678-9012（戶名：永不平凡籃球營）'
};

const $ = s => document.querySelector(s);
const S = { me: null, tab: null, cls: null, date: null, list: [], checkedIn: false, needCheckin: false, curKid: 'ALL', parentData: null, month: null, adm: null };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DN = '一二三四五六日';
const dayTxt = d => (d && d.length) ? '週' + d.map(n => DN[n - 1]).join('、') : '';
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
const parts = d => d.split('-').map(Number);
const dow = d => { const [y, m, dd] = parts(d); const w = new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); return w === 0 ? 7 : w; };
const addDays = (d, n) => { const [y, m, dd] = parts(d); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); };
const card = (t, b, x = '') => `<section class="card"><h2>${t}${x}</h2>${b}</section>`;
const pill = s => `<span class="pill ${/退回|拒絕|缺席/.test(s) ? 'bad' : /取消/.test(s) ? 'gray' : /待/.test(s) ? 'warn' : ''}">${esc(s)}</span>`;
const balT = b => b < 0 ? `欠 ${-b} 堂` : `剩 ${b} 堂`;
const bal = b => (b <= 1 ? '⚠️ ' : '') + balT(b);
const balPill = b => `<span class="pill ${b < 0 ? 'bad' : b <= 1 ? 'warn' : ''}">${bal(b)}</span>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'show'; setTimeout(() => t.className = '', 2800); }
async function run(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message); } finally { btn.disabled = false; } }
async function safe(fn) {
  try { await fn(); }
  catch (e) { $('#app').innerHTML = card('載入失敗', `<p>${esc(e.message)}</p><button class="pri" onclick="render()">重試</button>`); }
}

// ---------- 頁面內的小視窗（比 confirm()/prompt() 在 LINE 裡更穩定） ----------
function modal(html) {
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="box">${html}</div>`;
  document.body.appendChild(w); return w;
}
function ask(msg) {
  return new Promise(res => {
    const w = modal(`<p>${esc(msg).replace(/\n/g, '<br>')}</p><div class="two"><button class="ghost" data-x="no">取消</button><button class="pri" data-x="ok">確認</button></div>`);
    w.onclick = e => { const x = e.target.dataset && e.target.dataset.x; if (x) { w.remove(); res(x === 'ok'); } };
  });
}
function info(msg) {
  return new Promise(res => {
    const w = modal(`<p>${esc(msg).replace(/\n/g, '<br>')}</p><button class="pri" data-x="ok">知道了</button>`);
    w.onclick = e => { if (e.target.dataset && e.target.dataset.x) { w.remove(); res(); } };
  });
}
function dialog(title, fields, okText) { // fields: [{key,label,type,ph,value,options:[[v,label]]}]；取消回傳 null
  return new Promise(res => {
    const body = fields.map(f => {
      const lab = `<div class="lab">${esc(f.label)}</div>`;
      if (f.type === 'select') return lab + `<select data-k="${esc(f.key)}">${f.options.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`;
      return lab + `<input data-k="${esc(f.key)}" type="${esc(f.type || 'text')}" placeholder="${esc(f.ph || '')}" value="${esc(f.value ?? '')}">`;
    }).join('');
    const w = modal(`<p style="font-weight:800;margin-bottom:12px">${esc(title)}</p>${body}<div class="two" style="margin-top:6px"><button class="ghost" data-x="no">取消</button><button class="pri" data-x="ok">${esc(okText || '確認')}</button></div>`);
    w.onclick = e => {
      const x = e.target.dataset && e.target.dataset.x; if (!x) return;
      if (x === 'no') { w.remove(); res(null); return; }
      const v = {}; w.querySelectorAll('[data-k]').forEach(i => v[i.dataset.k] = i.value.trim());
      w.remove(); res(v);
    };
  });
}
function menu(title, items) { // items: [[key,label]]；取消回傳 null
  return new Promise(res => {
    const w = modal(`<p style="font-weight:800;margin-bottom:12px">${esc(title)}</p>${items.map(i => `<button class="ghost menu-btn" data-x="${esc(i[0])}">${esc(i[1])}</button>`).join('')}<button class="ghost menu-btn" data-x="__no" style="text-align:center">取消</button>`);
    w.onclick = e => { const x = e.target.dataset && e.target.dataset.x; if (x) { w.remove(); res(x === '__no' ? null : x); } };
  });
}

// ---------- 登入與 API ----------
function forceReLogin() { try { liff.logout(); } catch (e) {} liff.login(); }

async function api(action, data = {}) {
  let token = '';
  try { if (liff.isLoggedIn()) token = liff.getIDToken() || ''; } catch (e) {}
  const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, token, ...data }) });
  const j = await r.json();
  if (!j.ok) {
    if (/登入驗證失敗/.test(j.error)) { // 只自動重新登入一次，避免無限循環
      let n = 0; try { n = Number(sessionStorage.getItem('relogin') || 0); } catch (e) {}
      if (n < 1) { try { sessionStorage.setItem('relogin', String(n + 1)); } catch (e) {} forceReLogin(); return new Promise(() => {}); }
      throw new Error('登入已過期，請關閉後從 LINE 重新開啟');
    }
    throw new Error(j.error);
  }
  return j.data;
}

function updateGreeting() {
  const name = { guest: '訪客', parent: '家長', coach: '教練', admin: '總教練' }[S.me.role] || '';
  $('#greet').textContent = `${S.me.name}・${name}`;
}

async function init() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    S.me = await api('me');
    try { sessionStorage.removeItem('relogin'); } catch (e) {}
    render();
  } catch (e) {
    $('#app').innerHTML = card('需要重新驗證', `
      <p class="muted" style="color:var(--bad);font-weight:600">${esc(e.message)}</p>
      <button class="pri" onclick="forceReLogin()">重新登入 LINE ➜</button>
      <button class="ghost" style="width:100%;margin-top:10px" onclick="location.reload()">重新整理</button>`);
  }
}

// 動態按鈕一律用 data-act + data-* 屬性，不把資料塞進 onclick 字串
const ACT = {
  switchKid: d => switchKid(d.id),
  cancel: d => cancelReq(d.id),
  reviewPay: d => reviewPaySafe(d.id, d.d),
  reviewLeave: d => reviewLeaveUi(d.id, d.d),
  manageStu: d => manageStudent(d.id),
  delAdj: d => delAdj(d.id)
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) run(b, () => f(b.dataset, b));
});

function go(t) { S.tab = t; S.date = null; render(); }
function render() {
  const tabs = {
    guest: [['bind', '🎒 學員綁定']], parent: [['parent', '🏀 學員專區']], coach: [['coach', '👟 點名打卡']],
    admin: [['admin', '📊 後台總覽'], ['coach', '👟 點名打卡']]
  }[S.me.role] || [['bind', '🎒 學員綁定']];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('#nav').innerHTML = tabs.map(t => `<button class="${t[0] === S.tab ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  updateGreeting();
  S.parentData = null;
  safe({ bind: viewBind, parent: viewParent, coach: viewCoach, admin: viewAdmin }[S.tab]);
}

// ===================== 綁定 =====================
const bindBox = () => card('🎒 綁定學員', `<p class="muted">輸入營隊提供的綁定碼，立即查詢堂數與請假。爸爸媽媽可以各用自己的 LINE 綁定同一位學員。</p>
  <input id="code" placeholder="請輸入綁定碼">
  ${S.me.profile ? '' : `<input id="pname" maxlength="20" placeholder="家長真實姓名（必填，對帳用）"><input id="pphone" type="tel" inputmode="tel" placeholder="聯絡電話（必填）">`}
  <button class="pri" onclick="run(this,doBind)">立即綁定學員 ➜</button>`);
async function doBind() {
  const code = $('#code').value.trim();
  if (!code) throw new Error('請輸入綁定碼');
  const nm = $('#pname'), ph = $('#pphone');
  await api('bind', { code, name: nm ? nm.value.trim() : '', phone: ph ? ph.value.trim() : '' });
  S.me = await api('me');
  toast('綁定成功！');
  render();
}
function viewBind() {
  $('#app').innerHTML = bindBox() + card('📋 教練／總教練開通', `<p class="muted">請把下面這串 ID 傳給總教練，開通後重新開啟即可：</p><code>${esc(S.me.id)}</code>`);
}

// ===================== 家長 =====================
function stuById(id) { return (S.me.students || []).find(s => s.studentId === id); }
function classDates(st, n = 10) { // 該班接下來的上課日
  const out = []; let d = today();
  if (st.classStart && st.classStart > d) d = st.classStart;
  for (let i = 0; i < 180 && out.length < n; i++, d = addDays(d, 1)) {
    if (st.classEnd && d > st.classEnd) break;
    if ((st.classDays || []).includes(dow(d))) out.push(d);
  }
  return out;
}
function leaveDateHtml(st) {
  if (!st) return '';
  if (!(st.classDays || []).length) return `<input id="leave_date" type="date" min="${today()}" value="${today()}">`;
  const ds = classDates(st);
  if (!ds.length) return `<select id="leave_date" disabled><option value="">近期沒有可請假的上課日</option></select>`;
  return `<select id="leave_date">${ds.map(d => `<option value="${d}">${d}（週${DN[dow(d) - 1]}）</option>`).join('')}</select>`;
}
function onLeaveKid(id) { const b = $('#leave_date_box'); if (b) b.innerHTML = leaveDateHtml(stuById(id)); }
function updateMk() { // 補課日期的可選範圍跟著請假單變動
  const sel = $('#mk_leave'); if (!sel || !sel.selectedOptions[0]) return;
  const op = sel.selectedOptions[0], dt = $('#mk_date'); if (!dt) return;
  const mn = op.dataset.ld > today() ? op.dataset.ld : today();
  dt.min = mn; dt.max = op.dataset.dl;
  const h = $('#mk_hint'); if (h) h.textContent = `可選 ${mn} ～ ${op.dataset.dl} 之間的週日`;
}
function snapForm() {
  const o = {};
  document.querySelectorAll('#app [id]').forEach(el => { if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && el.type !== 'checkbox') o[el.id] = el.value; });
  return o;
}
function restoreForm(o) { // 切換孩子時保留已填一半的表單
  const set = id => { const el = document.getElementById(id); if (!el || o[id] === undefined) return;
    if (el.tagName === 'SELECT' && ![...el.options].some(x => x.value === o[id])) return; el.value = o[id]; };
  Object.keys(o).forEach(id => { if (id !== 'leave_date' && id !== 'mk_date') set(id); });
  if (o.leave_sid !== undefined && $('#leave_sid')) onLeaveKid($('#leave_sid').value);
  updateMk(); set('leave_date'); set('mk_date');
}

async function viewParent() {
  if (!S.parentData) {
    const d = await api('parentHome');
    S.me = d.me; S.parentData = { h: d.history, cl: d.classes, mo: d.makeup, periods: d.periods };
    updateGreeting();
  }
  const { h, cl, mo, periods } = S.parentData;
  const st = S.me.students || [];
  if (S.curKid !== 'ALL' && !st.some(s => s.studentId === S.curKid)) S.curKid = 'ALL';

  const kidTabs = st.length > 1 ? `<div class="kid-tabs">
    <button class="kid-btn ${S.curKid === 'ALL' ? 'active' : ''}" data-act="switchKid" data-id="ALL">全部學員 (${st.length})</button>
    ${st.map(s => `<button class="kid-btn ${S.curKid === s.studentId ? 'active' : ''}" data-act="switchKid" data-id="${esc(s.studentId)}">👦 ${esc(s.name)} (${balT(s.balance)})</button>`).join('')}</div>` : '';

  const vis = S.curKid === 'ALL' ? st : st.filter(s => s.studentId === S.curKid);
  const opt = vis.map(s => `<option value="${esc(s.studentId)}">${esc(s.name)}</option>`).join('');
  const attHtml = (h.attendances || []).filter(a => S.curKid === 'ALL' || a.studentId === S.curKid).map(a => `
    <div class="row"><div><b>${esc(a.date)}</b><div class="muted" style="margin:0">${esc(a.studentName)}・${esc(a.className)}</div></div>
    <span class="pill ${a.status === '出席' ? '' : a.status === '請假' ? 'warn' : 'bad'}">${esc(a.status)}</span></div>`).join('') || '<p class="muted">尚無課堂出勤紀錄</p>';

async function doSubmitPay() {
  const ids = [...document.querySelectorAll('.chk input:checked')].map(i => i.value);
  if (!ids.length) throw new Error('請勾選繳費的學員');
  await api('pay', { period: $('#pay_period').value, studentIds: ids, amount: $('#amt').value, last5: $('#l5').value.trim(), date: $('#pdate').value });
  toast('匯款已送出，等待總教練確認！'); render();
}
async function doSubmitLeave() {
  const dt = $('#leave_date');
  if (!dt || dt.disabled || !dt.value) throw new Error('請選擇請假的上課日');
  await api('leave', { studentId: $('#leave_sid').value, reasonType: $('#leave_reason_type').value, date: dt.value, reason: $('#leave_rsn').value });
  toast('請假申請已送出，等待總教練核准'); render();
}
async function doSubmitMakeup() {
  const d = $('#mk_date').value;
  if (!d) throw new Error('請選擇補課日期');
  if (dow(d) !== 7) throw new Error('補課日期限定為週日');
  await api('makeup', { leaveId: $('#mk_leave').value, targetClassId: $('#mk_cls').value, targetDate: d });
  toast('補課預約已送出'); render();
}
async function cancelReq(id) {
  if (!(await ask('確定要取消這筆申請嗎？'))) return;
  await api('cancel', { id });
  toast('已取消'); render();
}

async function viewCoach() {

  if (!cs.some(c => c.classId === S.cls)) S.cls = cs[0].classId;
  const isAdmin = S.me.role === 'admin';
  if (!isAdmin || !S.date) S.date = today();
  const r = await api('roster', { classId: S.cls, date: S.date });
  S.list = r.list; S.checkedIn = r.checkedIn; S.needCheckin = r.needCheckin;
  S.list.forEach(x => { x.v = x.saved || (x.leave ? '請假' : '未到'); });

    card('📍 簽到：' + esc(cur.name), `

        ${isToday && !S.checkedIn ? '<button class="pri mini" style="width:auto;font-size:14px;padding:10px 16px" onclick="run(this,doCheckin)">📍 簽到此班</button>' : ''}</div>
      <div style="border-top:1px dashed #f0e7dd;padding-top:8px;margin-top:6px"><div class="muted" style="font-weight:700">近期出勤紀錄</div>${logs}</div>`) +

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="muted" style="margin:0">${esc(cur.name)}・${esc(S.date)}</span>
        <button class="ghost mini" onclick="safe(viewCoach)">🔄 重新整理</button></div>
      ${S.needCheckin && !S.checkedIn ? '<p class="muted" style="color:var(--bad);font-weight:700">⚠️ 請先「簽到此班」才能儲存點名</p>' : ''}

async function changeClass(v) { S.cls = v; await safe(viewCoach); }

}

async function reviewPaySafe(id, decision) {

    if (!Object.keys(addMap).length) throw new Error('請至少為一位學員填寫要加的堂數');
  } else if (!nt.value.trim()) throw new Error('退回請填寫原因');
  await api('reviewPay', { id, decision, studentAddLessons: addMap, note: nt.value });
  toast('匯款審核完成！'); render();
}
async function reviewLeaveUi(id, decision) {
  let note = '';
  if (decision === 'reject') {
    const v = await dialog('婉拒申請', [{ key: 'note', label: '婉拒原因（家長會看到）', ph: '例如：該日已額滿' }], '確認婉拒');
    if (!v) return;
    if (!v.note) throw new Error('請填寫婉拒原因');
    note = v.note;
  }
  await api('reviewLeave', { id, decision, note });
  toast('假單處理完成！'); render();
}

// ---------- 學員管理 ----------
async function addStudentUi() {
  const cs = S.me.classes || [];
  const v = await dialog('新增學員', [
    { key: 'name', label: '學員姓名（必填）' },
    { key: 'classId', label: '班級', type: 'select', options: cs.map(c => [c.classId, c.name]) },
    { key: 'balance', label: '初始堂數', type: 'number', ph: '預設 0' },
    { key: 'phone', label: '緊急聯絡電話', type: 'tel', ph: '教練點名時可看到' },
    { key: 'note', label: '備註（過敏／傷病）', ph: '選填' },
    { key: 'studentId', label: '學員編號', ph: '留空自動產生' },
    { key: 'bindCode', label: '綁定碼', ph: '留空自動產生（兄弟姊妹請填相同綁定碼）' }
  ], '新增');
  if (!v) return;
  const r = await api('addStudent', v);
  await info(`已新增學員\n編號：${r.studentId}\n綁定碼：${r.bindCode}\n\n請把綁定碼提供給家長。`);
  render();
}
async function manageStudent(id) {
  const x = (S.adm.students || []).find(s => s.id === id); if (!x) return;
  const k = await menu(`${x.name}（${x.className}）・${balT(x.balance)}`, [
    ['adj', '✏️ 手動調整堂數'],
    ['unbind', `🔗 解除家長綁定（目前 ${x.bound} 個帳號）`],
    ['status', x.status === '結業' ? '🔄 恢復為在學' : '🎓 設為結業']
  ]);
  if (!k) return;
  if (k === 'adj') {
    const v = await dialog(`調整 ${x.name} 的堂數`, [
      { key: 'delta', label: '增減堂數', type: 'number', ph: '加 2 堂填 2；扣 1 堂填 -1' },
      { key: 'reason', label: '原因（必填，會留下紀錄）', ph: '例如：補償、退費、轉班' }], '確認調整');
    if (!v) return;
    await api('adjustBalance', { studentId: id, delta: v.delta, reason: v.reason });
    toast('堂數已調整');
  } else if (k === 'unbind') {
    if (!(await ask(`確定解除 ${x.name} 的所有家長綁定嗎？\n家長需要重新輸入綁定碼才能再看。`))) return;
    await api('unbind', { studentId: id });
    toast('已解除綁定');
  } else {
    const next = x.status === '結業' ? '在學' : '結業';
    if (!(await ask(`確定把 ${x.name} 設為「${next}」嗎？\n${next === '結業' ? '結業後不會出現在點名名單。' : ''}`))) return;
    await api('setStudentStatus', { studentId: id, status: next });
    toast('已更新狀態');
  }
  render();
}

function copySalary() {
  const a = S.adm;
  const rows = [['月份', '姓名', '身分', '授課堂數', '授課時數', '時薪', '基本薪資', '調整合計', '應付薪資']]
    .concat((a.coaches || []).map(c => [a.stats.month, c.name, c.role, c.lessonCount, c.totalHours, c.hourlyRate, c.base, c.adjTotal, c.totalSalary]));
  copyText(rows.map(r => r.join('\t')).join('\n'));
}
function copyText(t) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已複製，可貼到 Excel／Google 試算表'); } catch (e) { toast('複製失敗，請改用手動複製'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => toast('已複製，可貼到 Excel／Google 試算表')).catch(fallback);
  else fallback();
}
