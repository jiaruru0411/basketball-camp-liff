<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>永不平凡籃球營</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --pri: #ff6b00;
  --pri-light: #fff5ed;
  --pri-gradient: linear-gradient(135deg, #ff8a00 0%, #ff5500 100%);
  --ink: #1e293b;
  --mut: #64748b;
  --bg: #f8fafc;
  --card: #ffffff;
  --line: #edf2f7;
  --ok: #10b981;
  --ok-bg: #ecfdf5;
  --bad: #f43f5e;
  --bad-bg: #fff1f2;
  --warn: #f59e0b;
  --warn-bg: #fffbeb;
  --shadow: 0 4px 18px rgba(148, 163, 184, 0.12);
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(16px);
  padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 10px rgba(0,0,0,0.03);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--pri-gradient);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 24px;
  box-shadow: 0 6px 14px rgba(255, 107, 0, 0.28);
}
header b { font-size: 18px; font-weight: 800; color: var(--ink); }
#who { font-size: 13px; color: var(--pri); font-weight: 600; display: block; margin-top: 1px; }
main { padding: 16px; max-width: 520px; margin: 0 auto; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
h2 {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
input, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  padding: 12px 14px;
  border: 1.5px solid #e2e8f0;
  border-radius: 13px;
  background: #fdfefe;
  margin: 0 0 12px;
  color: var(--ink);
  transition: all 0.2s ease;
}
input:focus, select:focus {
  border-color: var(--pri);
  background: #fff;
  outline: none;
  box-shadow: 0 0 0 3.5px rgba(255, 107, 0, 0.15);
}
input[type=date] { min-height: 48px; }
input[type=checkbox] { width: 18px; height: 18px; margin: 0 8px 0 0; accent-color: var(--pri); }
button {
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  border: 0;
  border-radius: 13px;
  padding: 13px 16px;
  transition: transform 0.1s ease, opacity 0.2s;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.pri {
  width: 100%;
  background: var(--pri-gradient);
  color: #fff;
  box-shadow: 0 5px 16px rgba(255, 107, 0, 0.3);
}
.ghost {
  background: #f1f5f9;
  color: #334155;
}
.ghost:active { background: #e2e8f0; }
.row, .item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid #f1f5f9;
}
.row:first-of-type, .item:first-of-type { border-top: 0; }
.item { display: block; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.two > * { margin-bottom: 0; }
.muted { color: var(--mut); font-size: 14px; margin: 0 0 8px; }
.pill {
  font-size: 12.5px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--ok-bg);
  color: var(--ok);
  white-space: nowrap;
}
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.chk label { display: flex; align-items: center; padding: 7px 0; font-weight: 500; }
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.stat {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.stat b { font-size: 27px; font-weight: 800; color: var(--pri); line-height: 1.1; display: block; margin-bottom: 3px; }
.stat span { font-size: 13px; color: var(--mut); font-weight: 600; }
.seg { display: flex; gap: 6px; margin-top: 10px; }
.seg button {
  flex: 1;
  padding: 9px 0;
  background: #f1f5f9;
  color: #64748b;
  font-size: 14px;
  border-radius: 11px;
}
.seg button.on[data-s="出席"] { background: var(--ok); color: #fff; box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35); }
.seg button.on[data-s="請假"] { background: var(--warn); color: #fff; box-shadow: 0 3px 10px rgba(245, 158, 11, 0.35); }
.seg button.on[data-s="缺席"] { background: var(--bad); color: #fff; box-shadow: 0 3px 10px rgba(244, 63, 94, 0.35); }
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.03);
}
nav button {
  flex: 1;
  background: none;
  padding: 14px 4px;
  color: #94a3b8;
  border-radius: 0;
  font-size: 15px;
}
nav button.on {
  color: var(--pri);
  font-weight: 800;
  box-shadow: inset 0 3.5px 0 var(--pri);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: rgba(30, 41, 59, 0.94);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 11px 20px;
  border-radius: 99px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  max-width: 88%;
  text-align: center;
  font-size: 14.5px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
code {
  background: #f1f5f9;
  padding: 4px 8px;
  border-radius: 8px;
  word-break: break-all;
  font-size: 13.5px;
  color: var(--pri);
  font-weight: 700;
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏀</div>
    <div><b>永不平凡籃球營</b><span id="who">載入中…</span></div>
  </div>
</header>
<main id="app"><p class="muted">載入中…</p></main>
<nav id="nav"></nav><div id="toast"></div>

<script>
// ==================== 參數設定區 ====================
const CONFIG = {
  TEST_MODE: false,
  LIFF_ID: '2012507478-35PGiqXO',
  API_URL: 'https://script.google.com/macros/s/AKfycbwXzUnQ1zvcQhCHZs3ezX5tGsJzTCkbQVJij4ID7dWD7kgPFsWFYbySGoqBA8nSasGUzQ/exec',
  BANK: '匯款帳號：822 中國信託 1234-5678-9012（戶名：永不平凡籃球營）'
};
// ====================================================

const $ = s => document.querySelector(s);
const S = { me: null, tab: null, cls: null, date: null, list: [] };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const card = (t, b, x = '') => `<section class="card"><h2>${t}${x}</h2>${b}</section>`;
const pill = s => `<span class="pill ${/退回|拒絕|缺席/.test(s) ? 'bad' : /待/.test(s) ? 'warn' : ''}">${esc(s)}</span>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'show'; setTimeout(() => t.className = '', 2600); }
async function run(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { toast(e.message); } finally { btn.disabled = false; } }
async function safe(fn) { try { await fn(); } catch (e) { $('#app').innerHTML = card('載入失敗', `<p>${esc(e.message)}</p><button class="pri" onclick="render()">重試</button>`); } }

async function api(action, data = {}) {
  const token = (typeof liff !== 'undefined' && liff.isLoggedIn()) ? liff.getIDToken() : '';
  const r = await fetch(CONFIG.API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, token, ...data })
  });
  const j = await r.json();
  if (!j.ok) {
    if (/登入|token/i.test(j.error) && typeof liff !== 'undefined') {
      liff.logout();
      liff.login();
    }
    throw new Error(j.error);
  }
  return j.data;
}

async function init() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    S.me = await api('me');
    render();
  } catch (e) {
    $('#app').innerHTML = card('無法開啟', `<p>${esc(e.message)}</p><button class="pri" onclick="init()">重試</button>`);
  }
}

function render() {
  const r = S.me.role;
  const tabs = {
    guest: [['bind', '綁定']],
    parent: [['parent', '學員專區']],
    coach: [['coach', '點名打卡']],
    admin: [['admin', '後台總覽'], ['coach', '點名打卡']]
  }[r] || [['bind', '綁定']];

  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('#nav').innerHTML = tabs.map(t => `<button class="${t[0] === S.tab ? 'on' : ''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('');
  $('#who').textContent = `${S.me.name}・${{ guest: '訪客', parent: '家長', coach: '教練', admin: '總教練' }[r] || ''}`;
  safe({ bind: viewBind, parent: viewParent, coach: viewCoach, admin: viewAdmin }[S.tab]);
}

// ---------- 1. 綁定頁面 ----------
const bindBox = () => card('綁定學員', `<p class="muted">輸入營隊給你的綁定碼，就能看到孩子的堂數。</p><input id="code" placeholder="請輸入 6 碼綁定碼"><button class="pri" onclick="run(this,doBind)">綁定學員</button>`);

async function doBind() {
  const code = $('#code').value.trim();
  if (!code) throw new Error('請輸入綁定碼');
  await api('bind', { code });
  S.me = await api('me');
  toast('綁定成功！');
  render();
}

function viewBind() {
  $('#app').innerHTML = bindBox() + card('我是教練或總教練', `<p class="muted">請把這串 LINE ID 提供給管理員，在試算表設定權限後即可使用：</p><code>${esc(S.me.id)}</code>`);
}

// ---------- 2. 家長專區 ----------
async function viewParent() {
  const [h, cl] = await Promise.all([api('history'), api('classes')]);
  const st = S.me.students || [];
  const opt = st.map(s => `<option value="${s.studentId}">${esc(s.name)}</option>`).join('');

  $('#app').innerHTML =
    card('孩子的課務', st.map(s => `<div class="row"><div><b style="font-size:16px">${esc(s.name)}</b><div class="muted" style="margin:2px 0 0">${esc(s.className)}</div></div><span class="pill ${s.balance <= 1 ? 'warn' : ''}">剩餘 ${s.balance} 堂</span></div>`).join('') || '<p class="muted">尚未綁定學員</p>') +
    card('匯款對帳', `<p class="muted">${esc(CONFIG.BANK)}</p>
      <div class="chk">${st.map(s => `<label><input type="checkbox" value="${s.studentId}">${esc(s.name)}</label>`).join('')}</div>
      <div class="two"><input id="amt" type="number" inputmode="numeric" placeholder="匯款金額"><input id="l5" maxlength="5" inputmode="numeric" placeholder="帳號後五碼"></div>
      <p class="muted">轉帳日期</p><input id="pdate" type="date" value="${today()}">
      <button class="pri" onclick="run(this,doPay)">送出對帳資料</button>`) +
    card('請假與補課申請', `<select id="lst">${opt}</select>
      <select id="ltype" onchange="$('#lclsw').hidden = this.value !== '補課'"><option value="請假">請假</option><option value="補課">補課</option></select>
      <div id="lclsw" hidden><select id="lcls">${cl.map(c => `<option value="${c.classId}">${esc(c.name)}</option>`).join('')}</select></div>
      <input id="ldate" type="date" min="${today()}" value="${today()}">
      <input id="lrsn" placeholder="申請事由（選填）">
      <button class="pri" onclick="run(this,doLeave)">送出申請</button>`) +
    card('最近申請與繳費紀錄', (h.payments || []).map(p => `<div class="row"><span>匯款 $${esc(p.amount)}・${esc(p.studentNames)}</span>${pill(p.status)}</div>`).join('') + (h.leaves || []).map(l => `<div class="row"><span>${esc(l.type)} ${esc(l.date)}・${esc(l.studentName)}</span>${pill(l.status)}</div>`).join('') || '<p class="muted">尚無歷史紀錄</p>') +
    bindBox();
}

async function doPay() {
  const ids = [...document.querySelectorAll('.chk input:checked')].map(i => i.value);
  await api('pay', { studentIds: ids, amount: $('#amt').value, last5: $('#l5').value.trim(), date: $('#pdate').value });
  toast('匯款已送出，等待總教練確認');
  render();
}

async function doLeave() {
  await api('leave', { studentId: $('#lst').value, type: $('#ltype').value, classId: $('#lcls').value, date: $('#ldate').value, reason: $('#lrsn').value });
  toast('已送出申請');
  render();
}

// ---------- 3. 點名與簽到 ----------
const ATT_STATUS = ['出席', '請假', '缺席'];

async function viewCoach() {
  const cs = S.me.classes || [];
  if (!cs.length) {
    $('#app').innerHTML = card('尚未指派班級', '<p class="muted">請總教練於試算表「班級列表」中指派負責教練。</p>');
    return;
  }
  if (!cs.some(c => c.classId === S.cls)) S.cls = cs[0].classId;
  S.date = S.date || today();
  const isAdmin = S.me.role === 'admin';

  S.list = await api('roster', { classId: S.cls, date: S.date });
  S.list.forEach(x => { x.v = x.saved || (x.leave ? '請假' : '出席'); });

  $('#app').innerHTML =
    card('教練簽到', `<div class="row"><span>${today()}</span><button class="ghost" onclick="run(this,doCheckin)">當日簽到</button></div>`) +
    card('班級點名', `
      <select onchange="S.cls=this.value;render()">${cs.map(c => `<option value="${c.classId}" ${c.classId === S.cls ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <input type="date" value="${S.date}" ${isAdmin ? '' : 'disabled'} onchange="S.date=this.value;render()">
      <button class="ghost" style="width:100%;margin-bottom:12px" onclick="setAll('出席')">全班設為出席</button>
      <div id="roster">${rosterHtml()}</div>
      <button class="pri" style="margin-top:10px" onclick="run(this,doSaveAttendance)">儲存點名結果</button>`);
}

function rosterHtml() {
  if (!S.list.length) return '<p class="muted">此班級今日無學員名單</p>';
  return S.list.map((x, i) => `
    <div class="item">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <b style="font-size:16px">${esc(x.name)}</b> 
          ${x.makeup ? '<span class="pill warn">補課</span>' : ''} 
          ${x.saved ? '<span class="pill">已點名</span>' : ''}
        </div>
        <span class="muted" style="font-weight:600;margin:0">剩 ${x.balance} 堂</span>
      </div>
      <div class="seg">${ATT_STATUS.map(s => `<button data-s="${s}" class="${x.v === s ? 'on' : ''}" onclick="pickStatus(${i},'${s}')">${s}</button>`).join('')}</div>
    </div>`).join('');
}

function pickStatus(i, s) { S.list[i].v = s; $('#roster').innerHTML = rosterHtml(); }
function setAll(s) { S.list.forEach(x => x.v = s); $('#roster').innerHTML = rosterHtml(); }
async function doCheckin() { await api('coachCheckin'); toast('簽到成功'); }
async function doSaveAttendance() {
  await api('saveAttendance', { classId: S.cls, date: S.date, records: S.list.map(x => ({ studentId: x.studentId, status: x.v })) });
  toast('點名紀錄已儲存');
  render();
}

// ---------- 4. 總教練後台 ----------
async function viewAdmin() {
  const a = await api('admin');
  const s = a.stats || {};
  const box = (n, t) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`;

  $('#app').innerHTML =
    `<div class="stats">
      ${box(s.pendingPay ?? 0, '待審核匯款')}
      ${box(s.pendingLeave ?? 0, '待審核補課')}
      ${box((s.todayPresent ?? 0) + '/' + (s.todayTotal ?? 0), '今日出席')}
      ${box(s.low ?? 0, '堂數 ≤ 1 堂')}
    </div>` +
    card('待審核匯款', (a.payments || []).map(p => `
      <div class="item">
        <b style="font-size:16px">${esc(p.parentName)}</b>（學員：${esc(p.studentNames)}）
        <div class="muted" style="margin:4px 0 8px">$${esc(p.amount)}｜末五碼 <b>${esc(p.last5)}</b>｜轉帳日 ${esc(p.transferDate)}</div>
        <div class="two">
          <input id="ls_${p.id}" type="number" inputmode="numeric" placeholder="每位加幾堂（例：4）">
          <input id="nt_${p.id}" placeholder="退回說明（選填）">
        </div>
        <div class="two">
          <button class="pri" onclick="run(this,()=>reviewPay('${p.id}','pass'))">核准並加堂</button>
          <button class="ghost" onclick="run(this,()=>reviewPay('${p.id}','reject'))">退回款項</button>
        </div>
      </div>`).join('') || '<p class="muted">目前沒有待審核的匯款</p>') +
    card('待審核補課', (a.leaves || []).map(l => `
      <div class="item">
        <b style="font-size:16px">${esc(l.studentName)}</b> 申請於 <b>${esc(l.date)}</b> 補課（${esc(l.className)}）
        <div class="two" style="margin-top:10px">
          <button class="pri" onclick="run(this,()=>reviewLeave('${l.id}','pass'))">核准補課</button>
          <button class="ghost" onclick="run(this,()=>reviewLeave('${l.id}','reject'))">婉拒申請</button>
        </div>
      </div>`).join('') || '<p class="muted">目前沒有待審核的補課</p>') +
    card('學員堂數總覽', (a.students || []).map(x => `
      <div class="row">
        <span><b style="font-size:15px">${esc(x.name)}</b> <span class="muted" style="margin-left:4px">${esc(x.className)}${x.bound ? '' : '・未綁定'}</span></span>
        <span class="pill ${x.balance <= 1 ? 'warn' : ''}">${x.balance} 堂</span>
      </div>`).join('') || '<p class="muted">尚無學員資料</p>') +
    card('最近點名動態', (a.recent || []).map(r => `
      <div class="row">
        <span>${esc(r.date)} <b>${esc(r.name)}</b> <span class="muted" style="margin-left:4px">${esc(r.className)}・${esc(r.by)}</span></span>
        ${pill(r.status)}
      </div>`).join('') || '<p class="muted">尚無點名動態</p>');
}

async function reviewPay(id, decision) {
  await api('reviewPay', { id, decision, lessons: $('#ls_' + id)?.value, note: $('#nt_' + id)?.value });
  toast('匯款審核完成');
  render();
}

async function reviewLeave(id, decision) {
  await api('reviewLeave', { id, decision });
  toast('補課審核完成');
  render();
}

init();
</script>
</body>
</html>
