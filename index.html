<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>永不平凡籃球營</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --pri:#ff7315;--pri-grad:linear-gradient(135deg,#ff8c37 0%,#ff5e00 100%);
  --ink:#232d3f;--mut:#68798d;--card:#fff;--line:#f1eae2;
  --ok:#10b981;--ok-bg:#ecfdf5;--bad:#f43f5e;--bad-bg:#fff1f2;--warn:#f59e0b;--warn-bg:#fffbeb;
  --shadow-sm:0 4px 12px rgba(255,115,21,.06);--radius-lg:20px;--radius-md:14px;
}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 10% 10%,#fffbf7 0%,#f7f1ea 100%);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;border-bottom:1.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.12);background:#0f172a;font-size:24px}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
header b{font-size:17.5px;font-weight:800;color:#1e293b;display:block;line-height:1.3}
#greet{font-size:12.5px;color:var(--pri);font-weight:700;margin-top:1px;display:block}
main{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
h2{margin:0 0 14px;font-size:17px;font-weight:800;color:#1e293b;display:flex;align-items:center;justify-content:space-between;gap:8px}
input,select{display:block;width:100%!important;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid #e5e0d8;
  border-radius:var(--radius-md);background:#fdfcf9;margin:0 0 10px;color:var(--ink)}
input:focus,select:focus{border-color:var(--pri);background:#fff;outline:none;box-shadow:0 0 0 3.5px rgba(255,115,21,.14)}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-height:46px;line-height:1.3;text-align:left}
input[type=checkbox]{display:inline-block;width:19px!important;height:19px;margin:0 8px 0 0;accent-color:var(--pri)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:var(--radius-md);padding:12px 16px;transition:transform .1s ease}
button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:not-allowed}
.pri{width:100%;background:var(--pri-grad);color:#fff;box-shadow:0 6px 18px rgba(255,115,21,.28);font-size:16px}
.ghost{background:#f5efe6;color:#4a5568}
.mini{width:auto;padding:6px 12px;font-size:13px;border-radius:10px;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btns button{flex:1 1 auto;padding:10px 12px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed #f0e7dd}
.row:first-of-type{border-top:0}
.item{display:block;background:#fbf9f5;border:1.5px solid #f1eae2;border-radius:16px;padding:14px;margin-bottom:12px}
.item.leave-item{background:#f8fafc;border-color:#e2e8f0;opacity:0.92}
.item.makeup-item{background:#fffbeb;border-color:#fde68a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.two>*{margin-bottom:0}
.muted{color:var(--mut);font-size:14px;margin:0 0 8px}
.pill{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.gray{background:#f1f5f9;color:#64748b}
.chk label{display:flex;align-items:center;padding:7px 0;font-size:15px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-lg);padding:16px 14px;box-shadow:var(--shadow-sm)}
.stat b{font-size:27px;font-weight:900;color:var(--pri);display:block;line-height:1.1;margin-bottom:4px}
.stat span{font-size:13px;color:var(--mut);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.seg button{padding:9px 0;background:#e9ecef;color:#495057;font-size:13px;border-radius:10px}
.seg button.on[data-s="未到"]{background:#64748b;color:#fff}
.seg button.on[data-s="出席"]{background:#10b981;color:#fff}
.seg button.on[data-s="請假"]{background:#f59e0b;color:#fff}
.seg button.on[data-s="缺席"]{background:#ef4444;color:#fff}
.kid-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.kid-btn{background:#fff;border:1.5px solid #e5ded5;color:#4a5568;padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.kid-btn.active{background:var(--pri-grad);border-color:transparent;color:#fff;font-weight:800}
.memo-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.memo-btn{background:#f1eae2;border:0;color:#64748b;padding:9px 0;border-radius:12px;font-size:14px;font-weight:700}
.memo-btn.active{background:var(--pri-grad);color:#fff}
.rules-box{background:#fffaf0;border:1.5px solid #fed7aa;border-radius:16px;padding:14px;margin-top:12px;font-size:13.5px;color:#7c2d12;line-height:1.65}
.rules-box b{color:#9a3412;font-size:14px}.rules-box ol{margin:8px 0 0;padding-left:18px}
.lockbar{background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;padding:12px;border-radius:14px;font-size:14px;font-weight:800;margin-bottom:12px;line-height:1.4}
.safe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px}
.safe a{color:var(--pri);font-weight:700;text-decoration:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:14px 4px;color:#9ba7b6;font-size:14.5px;border-radius:0}
nav button.on{color:var(--pri);font-weight:800;box-shadow:inset 0 3.5px 0 var(--pri)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(35,45,63,.94);color:#fff;padding:11px 22px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .2s ease;font-size:14px;z-index:1000;max-width:90%;text-align:center}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:200;padding:20px}
.modal .box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:340px;max-height:86vh;overflow:auto}
.modal p{margin:0 0 16px;line-height:1.8}
.modal .lab{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 4px}
.menu-btn{width:100%;margin-bottom:8px;text-align:left}
code{background:#f5efe6;padding:4px 8px;border-radius:8px;word-break:break-all;font-size:13px;color:var(--pri);font-weight:700}

/* 全螢幕旋轉遮罩 */
#loading-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#loading-overlay.active{opacity:1;pointer-events:auto;}
.spinner{
  width:48px;height:48px;border:4px solid rgba(255,255,255,.3);
  border-top-color:var(--pri);border-radius:50%;
  animation:spin 0.8s linear infinite;margin-bottom:14px;
}
.loading-text{color:#fff;font-size:15px;font-weight:700;letter-spacing:0.5px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img src="./logo.png" alt="" onerror="this.replaceWith(document.createTextNode('🏀'))"></div>
    <div><b>永不平凡籃球營</b><span id="greet">活力載入中…</span></div>
  </div>
</header>
<main id="app"><p class="muted" style="text-align:center;padding:30px 0">載入中…</p></main>
<nav id="nav"></nav>
<div id="toast"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-msg">資料處理中，請稍候…</div>
</div>

<script>
const CONFIG = {
  LIFF_ID: '2012507478-35PGiqXO',
  API_URL: 'https://script.google.com/macros/s/AKfycbwXzUnQ1zvcQhCHZs3ezX5tGsJzTCkbQVJij4ID7dWD7kgPFsWFYbySGoqBA8nSasGUzQ/exec',
  BANK: '匯款帳號：822 中國信託 1234-5678-9012（戶名：永不平凡籃球營）',
  VENUE: '永平高中綜合大樓 3 樓室內體育館'
};

const $ = s => document.querySelector(s);
const S = { 
  me: null, tab: null, cls: null, date: null, list: [], checkedIn: false, 
  needCheckin: false, curKid: 'ALL', parentData: null, month: null, adm: null,
  memoTab: 'leave'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DN = '一二三四五六日';
const dayTxt = d => (d && d.length) ? '週' + d.map(n => DN[n - 1]).join('、') : '';
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
const parts = d => d.split('-').map(Number);
const dow = d => { const [y, m, dd] = parts(d); const w = new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); return w === 0 ? 7 : w; };
const addDays = (d, n) => { const [y, m, dd] = parts(d); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); };
const card = (t, b, x = '') => `<section class="card"><h2>${t}${x}</h2>${b}</section>`;
const pill = s => `<span class="pill ${/退回|拒絕|缺席/.test(s) ? 'bad' : /取消/.test(s) ? 'gray' : /待/.test(s) ? 'warn' : ''}">${esc(s)}</span>`;
const balT = b => b < 0 ? `欠 ${-b} 堂` : `剩 ${b} 堂`;
const bal = b => (b <= 1 ? '⚠️ ' : '') + balT(b);
const balPill = b => `<span class="pill ${b < 0 ? 'bad' : b <= 1 ? 'warn' : ''}">${bal(b)}</span>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'show'; setTimeout(() => t.className = '', 2800); }

function showLoading(msg = '資料處理中，請稍候…') {
  const o = $('#loading-overlay'), m = $('#loading-msg');
  if (m) m.textContent = msg;
  if (o) o.classList.add('active');
}
function hideLoading() {
  const o = $('#loading-overlay');
  if (o) o.classList.remove('active');
}

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try {
    await fn();
  } catch (e) {
    toast(e.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function safe(fn) {
  showLoading('載入中…');
  try { await fn(); }
  catch (e) { $('#app').innerHTML = card('載入失敗', `<p style="color:var(--bad);font-weight:700">${esc(e.message)}</p><button class="pri" onclick="render()">重試</button>`); }
  finally { hideLoading(); }
}

function modal(html) {
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="box">${html}</div>`;
  document.body.appendChild(w); return w;
}
function ask(msg) {
  return new Promise(res => {
    const w = modal(`<p>${esc(msg).replace(/\n/g, '<br>')}</p><div class="two"><button class="ghost" data-x="no">取消</button><button class="pri" data-x="ok">確認</button></div>`);
    w.onclick = e => { const x = e.target.dataset && e.target.dataset.x; if (x) { w.remove(); res(x === 'ok'); } };
  });
}
function info(msg) {
  return new Promise(res => {
    const w = modal(`<p>${esc(msg).replace(/\n/g, '<br>')}</p><button class="pri" data-x="ok">知道了</button>`);
    w.onclick = e => { if (e.target.dataset && e.target.dataset.x) { w.remove(); res(); } };
  });
}
function dialog(title, fields, okText) {
  return new Promise(res => {
    const body = fields.map(f => {
      const lab = `<div class="lab">${esc(f.label)}</div>`;
      if (f.type === 'select') return lab + `<select data-k="${esc(f.key)}">${f.options.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(f.value ?? '') ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
      return lab + `<input data-k="${esc(f.key)}" type="${esc(f.type || 'text')}" placeholder="${esc(f.ph || '')}" value="${esc(f.value ?? '')}">`;
    }).join('');
    const w = modal(`<p style="font-weight:800;margin-bottom:12px">${esc(title)}</p>${body}<div class="two" style="margin-top:6px"><button class="ghost" data-x="no">取消</button><button class="pri" data-x="ok">${esc(okText || '確認')}</button></div>`);
    w.onclick = e => {
      const x = e.target.dataset && e.target.dataset.x; if (!x) return;
      if (x === 'no') { w.remove(); res(null); return; }
      const v = {}; w.querySelectorAll('[data-k]').forEach(i => v[i.dataset.k] = i.value.trim());
      w.remove(); res(v);
    };
  });
}
function menu(title, items) {
  return new Promise(res => {
    const w = modal(`<p style="font-weight:800;margin-bottom:12px">${esc(title)}</p>${items.map(i => `<button class="ghost menu-btn" data-x="${esc(i[0])}">${esc(i[1])}</button>`).join('')}<button class="ghost menu-btn" data-x="__no" style="text-align:center">取消</button>`);
    w.onclick = e => { const x = e.target.dataset && e.target.dataset.x; if (x) { w.remove(); res(x === '__no' ? null : x); } };
  });
}

function forceReLogin() { try { liff.logout(); } catch (e) {} liff.login(); }

async function api(action, data = {}, silent = false) {
  let token = '';
  try { if (liff.isLoggedIn()) token = liff.getIDToken() || ''; } catch (e) {}
  
  if (!silent) showLoading();
  try {
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, token, asRole: S.asRole || '', ...data }) });
    const j = await r.json();
    if (!j.ok) {
      if (/登入驗證失敗/.test(j.error || '')) { // 只自動重新登入一次，避免無限循環
        let n = 0; try { n = Number(sessionStorage.getItem('relogin') || 0); } catch (e) {}
        if (n < 1) { try { sessionStorage.setItem('relogin', String(n + 1)); } catch (e) {} forceReLogin(); return new Promise(() => {}); }
        throw new Error('登入已過期，請關閉後從 LINE 重新開啟');
      }
      throw new Error(j.error || '伺服器處理失敗');
    }
    return j.data;
  } finally {
    if (!silent) hideLoading();
  }
}

function updateGreeting() {
  const name = { guest: '訪客', parent: '家長', coach: '教練', admin: '總教練' }[S.me.role] || '';
  $('#greet').textContent = `${S.me.name}・${name}`;
}

async function init() {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    S.me = await api('me', {}, true);
    try { sessionStorage.removeItem('relogin'); } catch (e) {}
    render();
  } catch (e) {
    $('#app').innerHTML = card('系統連線異常', `
      <p class="muted" style="color:var(--bad);font-weight:600">${esc(e.message)}</p>
      <button class="pri" onclick="forceReLogin()">重新登入 LINE ➜</button>
      <button class="ghost" style="width:100%;margin-top:10px" onclick="location.reload()">重新整理</button>`);
  }
}

const ACT = {
  switchKid: d => switchKid(d.id),
  cancel: d => cancelReq(d.id),
  reviewPay: d => reviewPaySafe(d.id, d.d),
  reviewLeave: d => reviewLeaveUi(d.id, d.d, d.k),
  manageStu: d => manageStudent(d.id),
  delAdj: d => delAdj(d.id),
  lockMonth: () => lockMonthUi(),
  unlockMonth: () => unlockMonthUi(),
  addAdj: () => addAdjUi(),
  adminCheckin: () => adminCheckinUi(),
  copySalary: () => copySalary(),
  copyFinance: () => copyFinance()
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) run(b, () => f(b.dataset, b));
});

const GRADES = ['幼稚園', '小一', '小二', '小三', '小四', '小五', '小六', '國一', '國二', '國三', '高中'];
const gradeOpts = [['', '未填']].concat(GRADES.map(g => [g, g]));
const FE_VER = '2026-11-12-r26';
function testBar() { // 測試模式：只有後端開了 TEST_MODE 的總教練才看得到
  let vb = document.getElementById('verbar');
  if (!vb) { vb = document.createElement('div'); vb.id = 'verbar'; vb.style.cssText = 'text-align:center;font-size:11px;color:#9ba7b6;padding:0 0 10px'; document.querySelector('main').after(vb); }
  vb.textContent = '前端 ' + FE_VER + '｜後端 ' + ((S.me && S.me.ver) || '舊版（尚未更新）') + (S.me && S.me.testMode ? '｜測試模式開啟' : '');
  let b = document.getElementById('testbar');
  if (!S.me || !S.me.testMode) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'testbar'; b.style.cssText = 'background:#fef3c7;border-bottom:1.5px solid #fde68a;padding:8px 14px;font-size:13px;font-weight:700;color:#92400e;display:flex;gap:8px;align-items:center'; document.querySelector('header').after(b); }
  const cur = S.asRole || 'admin';
  b.innerHTML = '🧪 測試身分：' + [['admin', '總教練'], ['coach', '教練'], ['parent', '家長']].map(o =>
    `<button class="${cur === o[0] ? 'pri' : 'ghost'} mini" style="width:auto" onclick="switchRole('${o[0]}')">${o[1]}</button>`).join('');
}
async function switchRole(r) {
  S.asRole = r === 'admin' ? '' : r; S.tab = null; S.date = null; S.parentData = null;
  S.me = await api('me');
  render();
}
function go(t) { S.tab = t; S.date = null; render(); }
function render() {
  const tabs = {
    guest: [['bind', '🎒 學員綁定']], parent: [['parent', '🏀 學員專區']], coach: [['coach', '👟 點名打卡']],
    admin: [['admin', '📊 後台總覽'], ['coach', '👟 點名打卡'], ['bind', '🎒 學員綁定']]
  }[S.me.role] || [['bind', '🎒 學員綁定']];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('#nav').innerHTML = tabs.map(t => `<button class="${t[0] === S.tab ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  updateGreeting();
  S.parentData = null;
  testBar();
  safe({ bind: viewBind, parent: viewParent, coach: viewCoach, admin: viewAdmin }[S.tab]);
}

// ===================== 綁定 =====================
const bindBox = () => card('🎒 綁定學員', `<p class="muted">輸入營隊提供的 6 碼綁定碼，立即查詢堂數與請假。</p>
  <input id="code" placeholder="請輸入綁定碼">
  ${S.me.profile ? '' : `<input id="pname" maxlength="20" placeholder="家長真實姓名（必填，對帳用）"><input id="pphone" type="tel" inputmode="tel" placeholder="聯絡電話（必填）">`}
  <button class="pri" onclick="run(this,doBind)">立即綁定學員 ➜</button>`);
async function doBind() {
  const code = $('#code').value.trim();
  if (!code) throw new Error('請輸入綁定碼');
  const nm = $('#pname'), ph = $('#pphone');
  await api('bind', { code, name: nm ? nm.value.trim() : '', phone: ph ? ph.value.trim() : '' });
  S.me = await api('me');
  render();
  setTimeout(() => toast('綁定成功！'), 100);
}
function viewBind() {
  $('#app').innerHTML = bindBox() + card('📋 教練／總教練開通', `<p class="muted">請把下面這串 ID 傳給總教練，開通後重新開啟即可：</p><code>${esc(S.me.id)}</code>`);
}

// ===================== 家長專區 =====================
function stuById(id) { return (S.me.students || []).find(s => s.studentId === id); }
function classDates(st, n = 10) {
  const out = []; let d = today();
  if (st.classStart && st.classStart > d) d = st.classStart;
  for (let i = 0; i < 180 && out.length < n; i++, d = addDays(d, 1)) {
    if (st.classEnd && d > st.classEnd) break;
    const cal = (S.parentData && S.parentData.cal) || [];
    if ((st.classDays || []).includes(dow(d)) && (!cal.length || cal.includes(d)) && !noticeOf(st, d)) out.push(d); // 停課的日子不用請假 // 有建「課程日曆」就只列簡章上的上課日
  }
  return out;
}
function leaveDateHtml(st) {
  if (!st) return '';
  if (!(st.classDays || []).length) return `<input id="leave_date" type="date" min="${today()}" value="${today()}">`;
  const ds = classDates(st);
  if (!ds.length) return `<select id="leave_date" disabled><option value="">近期沒有可請假的上課日</option></select>`;
  return `<select id="leave_date">${ds.map(d => `<option value="${d}">${d}（週${DN[dow(d) - 1]}）</option>`).join('')}</select>`;
}
function onLeaveKid(id) { const b = $('#leave_date_box'); if (b) b.innerHTML = leaveDateHtml(stuById(id)); }

function swapRefresh(keepDate) {
  const sidEl = $('#sw_sid'), de = $('#sw_date'), ce = $('#sw_cls'); if (!sidEl || !de || !ce) return;
  const st = stuById(sidEl.value); if (!st) return;
  if (!keepDate) {
    const ds = classDates(st);
    de.innerHTML = ds.length ? ds.map(d => `<option value="${d}">${d}（週${DN[dow(d) - 1]}）</option>`).join('') : '<option value="">近期沒有上課日</option>';
  }
  const own = ((S.parentData && S.parentData.cl) || []).find(c => c.classId === st.classId), d = de.value;
  const list = ((S.parentData && S.parentData.cl) || []).filter(c => c.classId !== st.classId && own && c.hours === own.hours && (!c.days || !c.days.length || (d && c.days.includes(dow(d)))));
  ce.innerHTML = list.length ? list.map(c => `<option value="${esc(c.classId)}">${esc(c.name)} (${c.hours}h)</option>`).join('') : '<option value="">沒有可換的班級（需不同時段、相同時數）</option>';
}
async function doSubmitSwap() {

  const op = sel.selectedOptions[0], cid = op.dataset.cid, h = Number(op.dataset.h) || 0, keep = cs.value;

    h.textContent = dl ? `限選 ${mn} ～ ${dl} 之間的週日（逾期無法補課）` : '限選週日開課時段';

function snapForm() {
  const o = {};
  document.querySelectorAll('#app [id]').forEach(el => { if (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && el.type !== 'checkbox') o[el.id] = el.value; });
  return o;
}
function restoreForm(o) {
  const set = id => { const el = document.getElementById(id); if (!el || o[id] === undefined) return;
    if (el.tagName === 'SELECT' && ![...el.options].some(x => x.value === o[id])) return; el.value = o[id]; };
  Object.keys(o).forEach(id => { if (id !== 'leave_date' && id !== 'mk_date' && id !== 'sw_date' && id !== 'sw_cls') set(id); });
  if ($('#sw_sid')) { swapRefresh(); set('sw_date'); swapRefresh(true); set('sw_cls'); }
  if (o.leave_sid !== undefined && $('#leave_sid')) onLeaveKid($('#leave_sid').value);
  updateMk(); set('leave_date'); set('mk_date');
}

function noticeBanner() { // 停課公告（家長）

  return `<div class="card" style="background:#fff1f2;border-color:#fecdd3"><h2 style="color:#be123c">🚫 停課公告</h2>

function scheduleCard(vis, h) { // #1 下一堂課與本期剩餘上課日
  const leaves = (h.leaves || []).filter(l => l.type === '請假' && (l.status === '已核准' || l.status === '待審核'));
  const swaps = (h.leaves || []).filter(l => l.type === '調課' && (l.status === '已核准' || l.status === '待審核'));
  const rows = vis.filter(s => s.status !== '結業').map(s => {
    const ds = classDates(s, 8);
    if (!ds.length) return `<div class="row"><div><b>${esc(s.name)}</b><div class="muted" style="margin:0">近期沒有排定的上課日</div></div></div>`;
    const tag = d => {
      const lv = leaves.find(l => l.studentId === s.studentId && l.date === d), sw = swaps.find(l => l.studentId === s.studentId && l.date === d);
      if (noticeOf(s, d)) return '<span class="pill bad">停課</span>';
      return lv ? `<span class="pill warn">${lv.status === '待審核' ? '請假待審' : '已請假'}</span>` : sw ? `<span class="pill" style="background:#eff6ff;color:#2563eb">${sw.status === '待審核' ? '調課待審' : '已調課'}</span>` : '';
    };
    return `<div class="item"><b>${esc(s.name)}</b>・${esc(s.grp || s.className)}
      <div style="font-size:18px;font-weight:800;color:var(--pri);margin:6px 0 2px">下一堂：${esc(ds[0])}（週${DN[dow(ds[0]) - 1]}）${tag(ds[0])}</div>
      <div class="muted" style="margin:0 0 6px">📍 ${esc(CONFIG.VENUE)}</div>
      <div class="muted" style="margin:0;font-size:13px">之後：${ds.slice(1).map(d => esc(d.slice(5)) + tag(d)).join('、') || '（本期已無）'}</div></div>`;
  });
  return card('📅 上課日程', rows.join('') || '<p class="muted">沒有進行中的學員</p>');
}
async function setAttf(v) {

function calcPay() { // 簡章金額試算（新舊生由總教練人工確認，這裡兩種都列出來供參考）
  const pl = S.plan || {}, terms = Number(($('#pay_terms') || {}).value || 1), shirts = Math.max(0, Math.floor(Number(($('#pay_shirts') || {}).value) || 0));
  const ids = [...document.querySelectorAll('.chk input:checked')].map(i => i.value);
  const fees = ids.map(i => (stuById(i) || {}).fee || 0);
  const hint = $('#pay_hint'); if (!hint) return;
  if (!ids.length || fees.some(x => !x)) { hint.textContent = ids.length ? '此班尚未設定費用，請依報名表單通知的金額輸入' : '請先勾選學員'; return; }
  const tot = id => fees.reduce((t, x) => t + x * terms - (((pl.discount || {})[id] || {})[terms] || 0), 0) + shirts * (pl.shirt || 450);
  hint.innerHTML = `參考金額：舊生 <b style="color:var(--pri)">$${tot('舊生').toLocaleString()}</b>／新生 <b style="color:var(--pri)">$${tot('新生').toLocaleString()}</b>（${ids.length} 人・${terms} 期${shirts ? '・T恤 ' + shirts + ' 件' : ''}）<br>請依報名後通知您的金額匯款，新舊生身分由總教練確認。`;
}

async function doSubmitPay() {
  const ids = [...document.querySelectorAll('.chk input:checked')].map(i => i.value);
  if (!ids.length) throw new Error('請勾選繳費的學員');
  await api('pay', { period: $('#pay_period').value, plan: { terms: $('#pay_terms').value, shirts: $('#pay_shirts').value }, studentIds: ids, amount: $('#amt').value, last5: $('#l5').value.trim(), date: $('#pdate').value });
  render();
  setTimeout(() => toast('繳費資料已送出，等待總教練確認！'), 100);
}
async function doSubmitLeave() {
  const dt = $('#leave_date');
  if (!dt || dt.disabled || !dt.value) throw new Error('請選擇請假的上課日');
  await api('leave', { studentId: $('#leave_sid').value, reasonType: $('#leave_reason_type').value, date: dt.value, reason: $('#leave_rsn').value });
  render();
  setTimeout(() => toast('請假申請已送出，等待總教練核准'), 100);
}

async function doSubmitMakeup() {
  const d = $('#mk_date').value;
  if (!d) throw new Error('請選擇補課日期');
  
  const sel = $('#mk_leave');
  if (!sel || !sel.selectedOptions[0]) throw new Error('請選擇要補課的假單');
  const dl = sel.selectedOptions[0].dataset.dl || '';

  if (dow(d) !== 7) {
    throw new Error('簡章規定補課日期限定為「週日」，請重新選擇！');
  }

  if (dl && d > dl) {
    throw new Error(`所選日期已超過該期結業後四週的最後期限（${dl} 前需補完），無法預約！`);
  }

  if (!$('#mk_cls').value) throw new Error('沒有可補課的班級（補課須選不同班、相同時數的班級）');
  await api('makeup', { leaveId: sel.value, targetClassId: $('#mk_cls').value, targetDate: d });
  render();
  setTimeout(() => toast('補課預約已送出，等待總教練確認！'), 100);
}

async function cancelReq(id) {
  if (!(await ask('確定要取消這筆申請嗎？'))) return;
  await api('cancel', { id });
  render();
  setTimeout(() => toast('已取消'), 100);
}

async function viewCoach() {
  const cs = S.me.classes || [];
  if (!cs.length) { $('#app').innerHTML = card('📋 尚未指派排班', '<p class="muted">目前無負責的班級，請洽總教練指派。</p>'); return; }
  if (!cs.some(c => c.classId === S.cls)) S.cls = cs[0].classId;
  const isAdmin = S.me.role === 'admin';
  if (!isAdmin || !S.date) S.date = today();
  const r = await api('roster', { classId: S.cls, date: S.date }, true);
  S.upcoming = r.upcoming || []; S.swapOut = r.swapOut || []; S.list = r.list; S.checkedIn = r.checkedIn; S.needCheckin = r.needCheckin; S.duty = r.duty || {}; S.cancelled = r.cancelled || '';
  
  S.list.forEach(x => { 
    x.v = x.saved || (x.leave ? '請假' : '未到'); 
  });

  let ms = null; try { ms = await api('mySalary', { month: S.cmonth || '' }, true); } catch (e) {}
  const cur = cs.find(c => c.classId === S.cls), isToday = S.date === today();
  const logs = (S.me.recentCheckins || []).map(k => `<div class="row" style="padding:6px 0"><span>${esc(k.date)}・${esc(k.className)}</span><span class="pill">已簽到 ${esc(k.time)}</span></div>`).join('') || '<p class="muted" style="margin:4px 0 0">近期尚無簽到紀錄</p>';

  const leaveCount = S.list.filter(x => x.leave).length;
  const makeupCount = S.list.filter(x => x.makeup).length;

  $('#app').innerHTML =
    card('🏫 選擇班級' + (isAdmin ? '與日期' : ''), `
      <select onchange="changeClass(this.value)">${cs.map(c => `<option value="${esc(c.classId)}" ${c.classId === S.cls ? 'selected' : ''}>${esc(c.name)} (${c.hours}h)</option>`).join('')}</select>
      ${isAdmin ? `<p class="muted" style="margin:0 0 4px">日期（總教練可補點過去的名）</p><input type="date" value="${S.date}" max="${today()}" onchange="changeDate(this.value)">` : `<p class="muted" style="margin:0">今天：${today()}</p>`}`) +
    card('📍 簽到：' + esc(cur.name), `
      <div class="row" style="border-top:0">
        <span>${isToday ? (S.checkedIn ? '<span class="pill">✓ 今日已簽到</span>' : '<span class="pill warn">尚未簽到</span>') : '<span class="muted" style="margin:0">簽到僅限當天</span>'}</span>
        ${isToday && !S.checkedIn && (S.duty.testMode || !S.needCheckin || (S.duty.onDuty && S.duty.inWindow !== false)) ? '<button class="pri mini" style="width:auto;font-size:14px;padding:10px 16px" onclick="run(this,doCheckin)">📍 簽到此班</button>' : ''}</div>
      ${S.needCheckin && isToday && !S.checkedIn && !S.duty.onDuty && !S.duty.testMode ? `<p class="muted" style="color:var(--bad);font-weight:700;margin:6px 0 0">今天這個班沒有排到您（今日排班：${esc((S.duty.names || []).join('、') || '無')}），如需代課請洽總教練。</p>` : ''}
      ${S.needCheckin && isToday && !S.checkedIn && S.duty.onDuty && S.duty.inWindow === false && !S.duty.testMode ? `<p class="muted" style="color:var(--bad);font-weight:700;margin:6px 0 0">目前不在簽到時間內，請在 ${esc(S.duty.window)} 之間簽到；時間到後按「重新整理」。</p>` : ''}
      ${S.needCheckin && S.duty.window ? `<p class="muted" style="margin:6px 0 0;font-size:13px">⏰ 簽到時間：${esc(S.duty.window)}（上課前後 30 分鐘）${S.duty.testMode ? '｜測試模式不受限制' : ''}</p>` : ''}
      <div style="border-top:1px dashed #f0e7dd;padding-top:8px;margin-top:6px"><div class="muted" style="font-weight:700">近期出勤紀錄</div>${logs}</div>`) +
    card('🏀 課堂學員點名', `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="muted" style="margin:0;font-weight:700">${esc(cur.name)}・${esc(S.date)}</span>
        <button class="ghost mini" onclick="safe(viewCoach)">🔄 重新整理</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px;font-size:13px">
        <span class="pill gray">名冊總計 ${S.list.length} 人</span>
        ${leaveCount ? `<span class="pill warn">📝 請假 ${leaveCount} 人</span>` : ''}
        ${makeupCount ? `<span class="pill" style="background:#fffbeb;color:#d97706">⭐ 補課 ${makeupCount} 人</span>` : ''}
      </div>
      ${S.needCheckin && !S.checkedIn ? '<p class="muted" style="color:var(--bad);font-weight:700">⚠️ 請先「簽到此班」才能儲存點名</p>' : ''}
      ${S.cancelled ? `<div class="item" style="background:#fff1f2;border-color:#fecdd3"><b style="color:#be123c">🚫 這個班 ${esc(S.date)} 已公告停課</b><div class="muted" style="margin:4px 0 0">原因：${esc(S.cancelled)}。不需要簽到與點名。</div></div>` : ''}
      ${leaveBox()}
      ${rosterSummary()}
      <button class="ghost" style="width:100%;margin-bottom:12px" onclick="setAll('出席')">⚡ 一鍵全班設為出席（請假學員自動保留）</button>
      <div id="roster">${rosterHtml()}</div>
      <button class="pri" style="margin-top:8px" onclick="run(this,doSaveAttendance)">🌟 儲存點名結果（未到不留紀錄、不扣堂）</button>`) + mySalaryCard(ms);
}
function mySalaryCard(m) { // 教練的班表與授課明細（不顯示時薪與金額）
  if (!m) return '';
  return card('🗓️ 我的班表與授課明細', `
    <div style="font-weight:800;margin:0 0 6px">接下來的上班日</div>
    ${(m.upcoming || []).map(u => `<div class="row" style="padding:7px 0"><span><b>${esc(u.date)}</b>（週${DN[dow(u.date) - 1]}）</span><span style="text-align:right">${esc(u.className)}<div class="muted" style="margin:0;font-size:12.5px">${u.tm ? esc(u.tm) + ' 開始・' : ''}${u.hours} 小時</div></span></div>`).join('') || '<p class="muted">目前沒有排到班，請洽總教練</p>'}
    <div style="border-top:1px dashed #f0e7dd;margin-top:10px;padding-top:10px">${(m.keys || []).length ? `<select onchange="S.cmonth=this.value;safe(viewCoach)">${m.keys.map(k => `<option value="${esc(k)}" ${k === m.month ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>` : `<input type="month" value="${esc(m.month)}" onchange="S.cmonth=this.value;safe(viewCoach)">`}
    <div class="stats"><div class="stat"><b>${m.lessonCount}</b><span>${esc(m.month)} 授課堂數</span></div><div class="stat"><b>${m.totalHours}</b><span>授課小時</span></div></div>
    <details><summary class="muted" style="cursor:pointer">授課明細（${(m.days || []).length} 筆）</summary>${(m.days || []).map(d => `<div class="row" style="padding:6px 0"><span>${esc(d.date)}・${esc(d.className)}${d.note ? `<span class="muted">（${esc(d.note)}）</span>` : ''}</span><span class="muted" style="margin:0">${d.hours} 小時</span></div>`).join('') || '<p class="muted">本月尚無簽到</p>'}</details></div>`);
}
async function changeClass(v) { S.cls = v; await safe(viewCoach); }
async function changeDate(v) { if (v) { S.date = v; await safe(viewCoach); } }
function leaveBox() { // 教練一眼看到：這天誰請假、誰補課、之後誰要請假
  const sw = S.list.filter(x => x.swap), swo = S.swapOut || [], lv = S.list.filter(x => x.leave), pend = S.list.filter(x => x.pendingLeave && !x.leave), mk = S.list.filter(x => x.makeup), up = S.upcoming || [];
  const line = (t, arr) => arr.length ? `<div style="margin:4px 0">${t}：${arr.map(x => `<b>${esc(x.name)}</b>${x.leaveReason ? `<span class="muted">（${esc(x.leaveReason)}）</span>` : ''}`).join('、')}</div>` : '';
  const upHtml = up.length ? `<div style="border-top:1px dashed #f0e7dd;margin-top:6px;padding-top:6px"><div class="muted" style="font-weight:700">之後 30 天已核准</div>${up.map(u => `<div class="row" style="padding:5px 0"><span>${esc(u.date)}・<b>${esc(u.name)}</b></span><span class="pill ${u.type === '補課' ? 'warn' : ''}">${esc(u.type)}</span></div>`).join('')}</div>` : '';
  return `<div class="item" style="background:#fffaf0"><div style="font-weight:800">📝 ${esc(S.date)} 請假／補課</div>
    ${lv.length || pend.length || mk.length || sw.length || swo.length ? line('請假', lv) + line('待審核請假', pend) + line('補課學員', mk) + (sw.length ? `<div style="margin:4px 0">調課來上：${sw.map(x => `<b>${esc(x.name)}</b><span class="muted">（${esc(x.swap)}）</span>`).join('、')}</div>` : '') + (swo.length ? `<div style="margin:4px 0">調去別班：${swo.map(x => `<b>${esc(x.name)}</b><span class="muted">（→${esc(x.to)}）</span>`).join('、')}</div>` : '') : '<p class="muted" style="margin:4px 0">今天沒有人請假或補課</p>'}${upHtml}</div>`;
}
function rosterSummary() {
  if (!S.list.length) return '';
  const done = S.list.filter(x => x.saved), by = [...new Set(done.map(x => x.by).filter(Boolean))];
  return `<p class="muted" style="font-weight:700;color:${done.length ? 'var(--ok)' : 'var(--mut)'}">已點名 ${done.length}／${S.list.length} 人${by.length ? '・點名教練：' + esc(by.join('、')) : ''}</p>`;
}
function rosterHtml() {
  if (!S.list.length) return '<p class="muted">這個班目前沒有學員</p>';
  return S.list.map((x, i) => `<div class="item ${x.makeup ? 'makeup-item' : ''} ${x.leave ? 'leave-item' : ''}">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <b>${esc(x.name)}</b> ${x.grade ? `<span class="pill gray">${esc(x.grade)}</span>` : ''}${x.grp ? `<span class="pill gray">${esc(x.grp)}</span>` : ''}${x.kind ? `<span class="pill" style="background:#fce7f3;color:#be185d">${x.kind === '試上' ? '🆕 試上' : '🔁 補課生'}</span>` : ''}
        ${x.makeup ? '<span class="pill" style="background:#fef3c7;color:#b45309">⭐ 跨班補課</span>' : ''}${x.swap ? `<span class="pill" style="background:#eff6ff;color:#2563eb">🔄 ${esc(x.swap)}</span>` : ''} 
        ${x.leave ? `<span class="pill warn">📝 事前請假（${esc(x.leaveReason || '已核准')}）</span>` : ''}
        ${x.saved ? `<span class="pill">${x.saved === '出席' ? '✓ 已出席' : esc(x.saved)}</span>` : ''}
      </div>
      <span class="muted" style="margin:0;font-weight:700">${bal(x.balance)}</span></div>
    ${x.saved && x.by ? `<div class="muted" style="margin:2px 0 0;font-size:12.5px">${esc(x.by)}・${esc(x.at)} 已點名</div>` : ''}
    ${x.note || x.phone ? `<div class="safe">${x.note ? `<span class="pill bad">⚠️ ${esc(x.note)}</span>` : ''}${x.phone ? `<a href="tel:${esc(x.phone.replace(/[^\d+]/g, ''))}">📞 ${esc(x.phone)}</a>` : ''}</div>` : ''}
    <div class="seg">${['未到', '出席', '請假', '缺席'].map(s => `<button type="button" data-s="${s}" class="${x.v === s ? 'on' : ''}" onclick="pickStatus(${i},'${s}')">${{ '未到': '⏳ 未到', '出席': '✓ 出席', '請假': '📝 請假', '缺席': '✕ 缺席' }[s]}</button>`).join('')}</div></div>`).join('');
}
function pickStatus(i, s) { if (S.list[i]) { S.list[i].v = s; $('#roster').innerHTML = rosterHtml(); } }
function setAll(s) { 
  S.list.forEach(x => { if (!x.leave) x.v = s; }); 
  $('#roster').innerHTML = rosterHtml(); 
}
async function doCheckin() { 
  await api('coachCheckin', { classId: S.cls }); 
  S.me = await api('me'); 
  render(); 
  setTimeout(() => toast('簽到成功！💪'), 100);
}
async function doSaveAttendance() {
  if (S.needCheckin && !S.checkedIn) throw new Error('請先簽到此班，才能儲存點名');
  const c = { '出席': 0, '請假': 0, '缺席': 0, '未到': 0 };
  S.list.forEach(x => c[x.v]++);
  if (!(await ask(`【點名確認】\n\n✓ 出席：${c['出席']} 人\n📝 請假：${c['請假']} 人\n✕ 缺席：${c['缺席']} 人\n⏳ 未到：${c['未到']} 人\n\n確認送出點名紀錄嗎？`))) return;
  try {
    await api('saveAttendance', { classId: S.cls, date: S.date, records: S.list.map(x => ({ studentId: x.studentId, status: x.v, expect: x.saved || '' })) });
  } catch (e) {
    if (/剛被其他教練更新/.test(e.message)) { await info(e.message); await safe(viewCoach); return; }
    throw e;
  }
  render();
  setTimeout(() => toast('點名完成並儲存！'), 100);
}

  S.memoTab = t;
  renderMemoBox();
}

function noticeCardAdmin(a) {
  const ns = a.notices || [], t = today();
  return card('🚫 停課公告', `<p class="muted">颱風、場地不能用時發布：該日受影響班級的學員會<b>自動請假（不計事假）</b>，家長開網頁就看到公告並可預約補課。</p>
    <button class="pri" style="margin-bottom:10px" onclick="run(this,postNoticeUi)">發布停課公告 ➜</button>` +
    (ns.map(n => `<div class="row"><div><b>${esc(n.date)}（週${DN[dow(n.date) - 1]}）${esc(n.className)}</b>${n.date < t ? ' <span class="pill gray">已過</span>' : ''}
      <div class="muted" style="margin:0;font-size:12.5px">${esc(n.reason)}｜${esc(n.by)} 發布・自動請假 ${n.count} 人</div></div>
      ${n.date >= t ? `<button class="ghost mini" onclick="run(this,()=>cancelNoticeUi('${esc(n.id)}'))">撤銷</button>` : ''}</div>`).join('') || '<p class="muted">目前沒有停課公告</p>'));
}
async function postNoticeUi() {
  const cs = S.me.classes || [];
  const v = await dialog('發布停課公告', [
    { key: 'date', label: '停課日期', type: 'date', value: today() },
    { key: 'classId', label: '哪個班停課', type: 'select', options: [['', '全部班級']].concat(cs.map(c => [c.classId, c.name])) },
    { key: 'reason', label: '原因（家長會看到）', ph: '例如：颱風停班停課／場地臨時不能使用' }], '發布');
  if (!v) return;
  if (!v.date) throw new Error('請選擇日期');
  if (!v.reason) throw new Error('請填寫原因');
  const lab = v.classId ? ((cs.find(c => c.classId === v.classId) || {}).name || v.classId) : '全部班級';
  if (!(await ask(`確定發布停課公告？\n\n日期：${v.date}\n範圍：${lab}\n原因：${v.reason}\n\n該日受影響的學員會自動請假（不計事假），並通知家長。`))) return;
  const r = await api('postNotice', v);
  render();
  setTimeout(() => toast(`已發布，${r.students} 位學員自動請假`), 100);
}
async function cancelNoticeUi(id) {
  if (!(await ask('確定撤銷這則停課公告？\n自動建立的請假會一併取消，課程恢復正常。'))) return;
  await api('cancelNotice', { id });
  render();
  setTimeout(() => toast('已撤銷停課公告'), 100);
}
function schedPick(v) { S.schedDate = v; const e = document.getElementById('sched_box'); if (e) e.innerHTML = schedBody(S.adm.schedule); }
function schedBody(sc) {
  const d = (sc.dates || []).find(x => x.date === S.schedDate) || (sc.dates || [])[0];
  if (!d) return '<p class="muted">近期沒有上課日</p>';
  const nameOf = id => ((sc.staff || []).find(x => x.id === id) || {}).name || '未登錄';
  return d.classes.map(c => `<div class="row" style="padding:8px 0"><div>${esc(c.name)}${c.tm && c.name.indexOf(c.tm) === -1 ? `<span class="muted"> ${esc(c.tm)}</span>` : ''}
    <div class="muted" style="margin:0;font-size:12.5px">${c.ids.map(nameOf).map(esc).join('、') || '尚未指派教練'}${c.custom ? ' <span class="pill warn">已調整</span>' : ''}</div></div>
    <button class="ghost mini" onclick="editSchedule('${esc(d.date)}','${esc(c.id)}')">調整</button></div>`).join('');
}
function scheduleCardAdmin(a) { // 排班：選日期看那天各班的教練，一次只顯示一天，畫面不會太長
  const sc = a.schedule || { dates: [], staff: [] };
  if (!sc.dates.some(x => x.date === S.schedDate)) S.schedDate = (sc.dates[0] || {}).date;
  return card('👥 排班', `<p class="muted">平常用「班級列表」設定的教練；臨時要換人，選日期後按該班的「調整」。只有排到班的教練可以簽到。</p>
    <select onchange="schedPick(this.value)">${(sc.dates || []).map(d => `<option value="${esc(d.date)}" ${d.date === S.schedDate ? 'selected' : ''}>${esc(d.date)}（週${DN[dow(d.date) - 1]}）${d.classes.some(c => c.custom) ? '・有調整' : ''}</option>`).join('')}</select>
    <div id="sched_box">${schedBody(sc)}</div>
    <button class="ghost" style="margin-top:10px;width:100%" onclick="batchSchedule()">📅 批次排班（一次排整期）</button>`);
}
function warnBox(list) { // 排班後若有教練時間重疊，跳出提醒（已儲存，只是提醒）
  if (!list || !list.length) return;
  const w = modal(`<p style="font-weight:800;margin-bottom:6px">⚠️ 已儲存，但有時間重疊</p><p class="muted" style="margin-bottom:8px">${list.map(esc).join('<br>')}</p><p class="muted">若是刻意安排可忽略；否則請回排班調整。</p><button class="pri" data-x="ok">我知道了</button>`);
  w.onclick = e => { if (e.target.dataset && e.target.dataset.x) w.remove(); };
}
function batchSchedule() { // 批次排班：選一個班 → 選教練與方式 → 選日期；預設「加入」，不會洗掉原本排好的人
  const sc = S.adm.schedule || { dates: [], staff: [] }, seen = {}, cls = [];
  (sc.dates || []).forEach(d => d.classes.forEach(c => { if (!seen[c.id]) { seen[c.id] = 1; cls.push(c); } }));
  if (!cls.length) { toast('目前沒有可排班的班級'); return; }
  const nameOf = id => ((sc.staff || []).find(x => x.id === id) || {}).name || '未登錄';
  const w = modal(`<p style="font-weight:800;margin-bottom:6px">批次排班</p>
    <p class="muted">1. 選班級</p>
    <select id="bs_cls">${cls.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>
    <p class="muted" style="margin-top:8px">2. 要怎麼排</p>
    <select id="bs_mode"><option value="add">加入：把勾選的教練加進去（保留原本排好的人）</option><option value="remove">移除：把勾選的教練拿掉（例如某幾週不能來）</option><option value="replace">取代：只留勾選的教練（全不勾＝回復預設）</option></select>
    <p class="muted" style="margin-top:8px">3. 勾選教練</p>
    <div class="chk" id="bs_staff">${(sc.staff || []).map(x => `<label><input type="checkbox" value="${esc(x.id)}">${esc(x.name)}</label>`).join('')}</div>
    <p class="muted" id="bs_cnt" style="margin-top:8px"></p>
    <div class="chk" id="bs_dates"></div>
    <div class="two" style="margin-top:8px"><button class="ghost" data-x="all">日期全選／全不選</button><span></span></div>
    <div class="two" style="margin-top:8px"><button class="ghost" data-x="no">取消</button><button class="pri" data-x="ok">套用</button></div>`);
  const sel = w.querySelector('#bs_cls');
  const ds = () => [...w.querySelectorAll('#bs_dates input')];
  const count = () => { w.querySelector('#bs_cnt').textContent = '4. 勾選要套用的日期（已選 ' + ds().filter(i => i.checked).length + '／' + ds().length + ' 天；日期後面是目前排的教練）'; };
  const fillDates = () => {
    const days = (sc.dates || []).filter(d => d.classes.some(c => c.id === sel.value));
    w.querySelector('#bs_dates').innerHTML = days.map(d => { const c = d.classes.find(k => k.id === sel.value); return `<label><input type="checkbox" value="${esc(d.date)}" checked>${esc(d.date)}（週${DN[dow(d.date) - 1]}）・${esc((c.ids || []).map(nameOf).join('、') || '未指派')}</label>`; }).join('') || '<span class="muted">沒有上課日</span>';
    count();

      ${locked ? `<div class="lockbar">🔒 已由 ${esc(locked.by)} 於 ${esc(locked.time)} 月結鎖定，以下為鎖定當時的金額</div>` : ''}
      ${coachHtml}<div class="btns">${salaryBtns}</div>`) +
    card('📋 出勤備忘錄（已核准名單）', `<div id="memo_container"></div>`) +
    card('⛹️ 全部學員名冊', `<input type="search" placeholder="🔍 搜尋姓名／班級／編號" oninput="filterStu(this.value)">` +
      ((a.students || []).map(x => `<div class="row stu-row" data-q="${esc((x.name + x.id + x.className + (x.grp || '') + (x.grade || '')).toLowerCase())}"><div>
        <b>${esc(x.name)}</b> <span class="muted">${esc(x.className)}${x.grp ? '・' + esc(x.grp) : ''}${x.grade ? '・' + esc(x.grade) : ''}${x.kind ? '・' + esc(x.kind) : ''}</span>
        <div class="muted" style="margin:0;font-size:12.5px">${x.bound ? `已綁 ${x.bound} 個帳號` : '未綁定'}${x.status === '結業' ? '・已結業' : ''}${x.note ? '・⚠️ ' + esc(x.note) : ''}</div></div>
        <div style="display:flex;align-items:center;gap:8px">${balPill(x.balance)}<button class="ghost mini" data-act="manageStu" data-id="${esc(x.id)}">管理</button></div></div>`).join('') || '<p class="muted">尚無學員資料</p>'),
      `<button class="ghost mini" onclick="run(this,addStudentUi)">＋ 新增學員</button>`) +
    card('🧾 最近堂數調整', (a.adjustLogs || []).map(r => `<div class="row"><span>${esc(r.date)} <b>${esc(r.name)}</b> <span class="muted">${esc(r.reason)}・${esc(r.by)}</span></span>
      <span class="pill ${r.delta < 0 ? 'bad' : ''}">${r.delta > 0 ? '+' : ''}${r.delta} → ${r.after}</span></div>`).join('') || '<p class="muted">尚無調整紀錄</p>') +
    card('🗂️ 最近點名紀錄', (a.recent || []).map(r => `<div class="row"><span>${esc(r.date)} <b>${esc(r.name)}</b> <span class="muted">${esc(r.className)}・${esc(r.by)}</span></span>${pill(r.status)}</div>`).join('') || '<p class="muted">尚無點名紀錄</p>') +
    financeCard(a) +
    noticeCardAdmin(a) +
    card('🧾 操作紀錄（最近 10 筆）', (a.opLogs || []).slice(0,10).map(r => `<div class="row" style="padding:8px 0"><div><b>${esc(r.action)}</b>・${esc(r.target)}
      <div class="muted" style="margin:0;font-size:12.5px">${esc(r.by)} ${esc(r.at)}${r.detail ? '｜' + esc(r.detail) : ''}</div></div></div>`).join('') || '<p class="muted">尚無操作紀錄</p>');

  renderMemoBox();
}

function filterStu(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.stu-row').forEach(r => r.hidden = !!q && r.dataset.q.indexOf(q) === -1);
}

async function reviewPaySafe(id, decision) {
  const addMap = {};
  const box = document.getElementById('pay_item_' + id), nt = document.getElementById('nt_' + id);
  if (decision === 'pass') {
    box.querySelectorAll('.add-lesson-input').forEach(inp => { 
      const v = Number(inp.value); 
      if (v > 0) addMap[inp.getAttribute('data-sid')] = v; 
    });
    if (!Object.keys(addMap).length) throw new Error('請至少為一位學員填寫要加的堂數');
  } else if (!nt.value.trim()) throw new Error('退回請填寫原因');
  await api('reviewPay', { id, decision, studentAddLessons: addMap, note: nt.value });
  render();
  setTimeout(() => toast('匯款審核完成！'), 100);
}
async function reviewLeaveUi(id, decision, kind) {
  let note = '';
  if (decision === 'reject') {
    const v = await dialog('婉拒申請', [{ key: 'note', label: '婉拒原因（家長會看到）', ph: '例如：該日補課人數已滿' }], '確認婉拒');
    if (!v) return;
    if (!v.note) throw new Error('請填寫婉拒原因');
    note = v.note;
  }
  await api('reviewLeave', { id, decision, note, kind: kind || '' });
  render();
  setTimeout(() => toast('申請處理完成！'), 100);
}

    { key: 'visitClassId', label: '上課的班級（試上／補課來上哪一班；不選＝上面的班級）', type: 'select', value: '', options: [['', '同上面的班級']].concat(cs.map(c => [c.classId, c.name])) },

    { key: 'group', label: '班別（基礎／競技合開的班才選）', type: 'select', value: '', options: [['', '不分班別'], ['基礎班', '基礎班'], ['競技班', '競技班']] },
    { key: 'grade', label: '年級（教練點名時可看到）', type: 'select', value: '', options: gradeOpts },
    { key: 'phone', label: '緊急聯絡電話（必填）', type: 'tel', ph: '教練點名時可看到' },
    { key: 'note', label: '備註（過敏／傷病）', ph: '選填' },
    { key: 'studentId', label: '學員編號', ph: '留空自動產生' },

  ], '新增');

async function manageStudent(id) {
  const x = (S.adm.students || []).find(s => s.id === id); if (!x) return;
  const k = await menu(`${x.name}（${x.className}${x.grp ? '・' + x.grp : ''}）・${balT(x.balance)}`, [
    ['edit', '📝 修改學員資料（姓名／班級／電話／備註／可同時調堂數）'],
    ...(x.kind ? [['visit', `📅 新增${x.kind}上課日期（不是每週來，要來的那天再加）`]] : []),
    ['adj', '✏️ 手動調整堂數'],
    ['unbind', `🔗 解除家長綁定（目前 ${x.bound} 個帳號）`],
    ['status', x.status === '結業' ? '🔄 恢復為在學' : '🎓 設為結業']
  ]);
  if (!k) return;
  if (k === 'visit') {
    const cs0 = S.me.classes || [];
    const v = await dialog(`${x.name}・新增${x.kind}日期`, [
      { key: 'date', label: '上課日期', type: 'date' },
      { key: 'classId', label: '上課的班級', type: 'select', value: x.classId, options: cs0.map(c => [c.classId, c.name]) }], '新增');
    if (!v) return;
    if (!v.date) throw new Error('請選擇日期');
    await api('addVisit', { studentId: id, date: v.date, classId: v.classId });
    render(); setTimeout(() => toast('已新增 ' + v.date + ' 的上課安排'), 100);
    return;
  }
  if (k === 'edit') {
    const v = await dialog(`修改 ${x.name} 的資料`, [
      { key: 'name', label: '姓名', value: x.name },
      { key: 'classId', label: '班級', type: 'select', value: x.classId, options: (S.me.classes || []).map(c => [c.classId, c.name]) },
      { key: 'group', label: '班別（基礎／競技）', type: 'select', value: x.grp || '', options: [['', '不分班別'], ['基礎班', '基礎班'], ['競技班', '競技班']] },
      { key: 'grade', label: '年級（長大了在這裡改）', type: 'select', value: x.grade || '', options: gradeOpts },
      { key: 'kind', label: '學員類型（試上轉正式請改成正式）', type: 'select', value: x.kind || '', options: [['', '正式學員'], ['試上', '試上'], ['補課', '補課']] },
      { key: 'phone', label: '緊急聯絡電話（必填）', type: 'tel', value: x.phone || '' },
      { key: 'note', label: '備註（過敏／傷病）', value: x.note || '' },
      { key: 'delta', label: '同時調整堂數（選填）', type: 'number', ph: '不調整就留空；加 7 堂填 7，扣 1 堂填 -1' },
      { key: 'reason', label: '調整堂數的原因（有填堂數才必填）', ph: '例如：試上轉正式報名' }], '儲存');
    if (!v) return;
    if (String(v.phone || '').replace(/\D/g, '').length < 8) throw new Error('緊急聯絡電話為必填（至少 8 碼）');
    const delta = v.delta === '' ? 0 : Number(v.delta);
    if (!isFinite(delta) || Math.floor(delta) !== delta) throw new Error('堂數請填整數');
    if (delta !== 0 && !v.reason) throw new Error('有調整堂數，請填寫原因');
    const changed = v.name !== x.name || v.classId !== x.classId || (v.group || '') !== (x.grp || '') || (v.grade || '') !== (x.grade || '') || (v.kind || '') !== (x.kind || '') || (v.phone || '') !== (x.phone || '') || (v.note || '') !== (x.note || '');
    if (!changed && delta === 0) throw new Error('沒有任何變更');
    if (changed) await api('updateStudent', { studentId: id, name: v.name, classId: v.classId, group: v.group, grade: v.grade, kind: v.kind, phone: v.phone, note: v.note });
    if (delta !== 0) { await api('adjustBalance', { studentId: id, delta: delta, reason: v.reason }); x.balance = Number(x.balance || 0) + delta; }
    render();
    setTimeout(() => toast(changed && delta !== 0 ? '資料與堂數已更新' : delta !== 0 ? '堂數已調整' : '學員資料已更新'), 100);
    return;
  }
  if (k === 'adj') {
    const v = await dialog(`調整 ${x.name} 的堂數`, [
      { key: 'delta', label: '增減堂數', type: 'number', ph: '加 2 堂填 2；扣 1 堂填 -1' },
      { key: 'reason', label: '原因（必填，會留下紀錄）', ph: '例如：補償、退費、轉班' }], '確認調整');
    if (!v) return;
    const deltaNum = Number(v.delta);
    await api('adjustBalance', { studentId: id, delta: deltaNum, reason: v.reason });
    x.balance = Number(x.balance || 0) + deltaNum;
    render();
    setTimeout(() => toast('堂數已調整'), 100);
  } else if (k === 'unbind') {
    if (!(await ask(`確定解除 ${x.name} 的所有家長綁定嗎？\n家長需要重新輸入綁定碼才能再看。`))) return;
    await api('unbind', { studentId: id });
    x.bound = 0;
    render();
    setTimeout(() => toast('已解除綁定'), 100);
  } else {
    const next = x.status === '結業' ? '在學' : '結業';
    if (!(await ask(`確定把 ${x.name} 設為「${next}」嗎？\n${next === '結業' ? '結業後不會出現在點名名單。' : ''}`))) return;
    await api('setStudentStatus', { studentId: id, status: next });
    x.status = next;
    render();
    setTimeout(() => toast('已更新狀態'), 100);
  }
}

function copyFinance() {
  const fp = (S.adm && S.adm.financeP) || { periods: [] }, g = (fp.periods || []).find(p => p.period === S.finPeriod) || { list: [] };
  const rows = [['期別', '日期', '學員', '家長', '方式', '本期金額', '付款總額', '經手人']].concat((g.list || []).map(r => [S.finPeriod, r.date, r.students, r.who, r.method, r.amount, r.total, r.by]));
  copyText(rows.map(r => r.join('\t')).join('\n'));
}
function copySalary() {
  const a = S.adm;
  const rows = [['期別', '姓名', '身分', '授課堂數', '授課時數', '時薪', '基本薪資', '調整合計', '應付薪資']]
    .concat((a.coaches || []).map(c => [a.stats.month, c.name, c.role, c.lessonCount, c.totalHours, c.hourlyRate, c.base, c.adjTotal, c.totalSalary]));
  copyText(rows.map(r => r.join('\t')).join('\n'));
}
function copyText(t) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已複製，可貼到 Excel／Google 追蹤表'); } catch (e) { toast('複製失敗，請改用手動複製'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => toast('已複製，可貼到 Excel／Google 追蹤表')).catch(fallback);
  else fallback();
}
